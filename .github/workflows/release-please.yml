name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain release PR or cut release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create release commits, tags and GitHub Releases
      pull-requests: write # create and update the release PR
      id-token: write      # exchange GitHub OIDC for a short-lived broker token
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint a repository-scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@8d14adaa295c4a7670b1d4e744b070955b710598 # v1.24.0
        with:
          permission-set: release-please-grafana-cloud-org-insights
          role: release-please-grafana-cloud-org-insights
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bao.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Find open release PR branch
        id: release-pr
        env:
          APP_TOKEN: ${{ steps.bao.outputs.token }}
          RELEASE_PR_BRANCH: release-please--branches--main--components--grafana-cloud-org-insights
        run: |
          set -euo pipefail
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          response="$(curl --fail --silent --show-error \
            --get \
            --data-urlencode "state=open" \
            --data-urlencode "head=${repository_owner}:${RELEASE_PR_BRANCH}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer ${APP_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls")"
          pr_count="$(jq --arg branch "$RELEASE_PR_BRANCH" --arg repository "$GITHUB_REPOSITORY" \
            '[.[] | select(.state == "open" and .head.ref == $branch and .head.repo.full_name == $repository)] | length' \
            <<<"$response")"

          if [[ "$pr_count" -eq 0 ]]; then
            echo "No open release PR on ${RELEASE_PR_BRANCH}; skipping changelog normalization."
            exit 0
          fi
          if [[ "$pr_count" -ne 1 ]]; then
            echo "::error::Expected one open release PR on ${RELEASE_PR_BRANCH}, found ${pr_count}."
            exit 1
          fi

          branch="$(jq -er --arg branch "$RELEASE_PR_BRANCH" \
            '[.[] | select(.state == "open" and .head.ref == $branch)][0].head.ref' \
            <<<"$response")"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Check out open release PR
        if: steps.release-pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          persist-credentials: false

      - name: Normalize release changelog and commit through GitHub
        if: steps.release-pr.outputs.branch != ''
        env:
          APP_TOKEN: ${{ steps.bao.outputs.token }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("CHANGELOG.md")
          original = path.read_text(encoding="utf-8")
          normalized = re.sub(r"[ \t]*[\u2014\u2013][ \t]*", " - ", original)
          if normalized != original:
              path.write_text(normalized, encoding="utf-8")
          PY

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already normalized."
            exit 0
          fi

          expected_head="$(git rev-parse HEAD)"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$RELEASE_PR_BRANCH" \
            --arg expected_head "$expected_head" \
            --rawfile contents CHANGELOG.md \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                  expectedHeadOid: $expected_head,
                  message: {headline: "fix: normalize release changelog punctuation"},
                  fileChanges: {additions: [{path: "CHANGELOG.md", contents: ($contents | @base64)}]}
                }
              }
            }')"
          commit_oid="$(GH_TOKEN="$APP_TOKEN" gh api graphql --input - --jq \
            '.data.createCommitOnBranch.commit.oid // error("GitHub did not return the normalization commit OID")' \
            <<<"$payload")"
          echo "Created changelog normalization commit ${commit_oid} on ${RELEASE_PR_BRANCH}."

  release-image:
    name: publish stable image
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write        # attach SBOMs to the GitHub Release
      packages: write        # push the image to GHCR
      id-token: write        # obtain keyless signing credentials
      attestations: write    # publish build provenance
      security-events: write # upload the Trivy SARIF report
    uses: ./.github/workflows/publish.yml
    with:
      release-tag: ${{ needs.release-please.outputs.tag-name }}

  edge-image:
    name: publish edge image
    needs: release-please
    if: needs.release-please.outputs.release-created != 'true'
    permissions:
      contents: write        # attach release artifacts if applicable
      packages: write        # push the edge image to GHCR
      id-token: write        # obtain keyless signing credentials
      attestations: write    # publish build provenance
      security-events: write # upload the Trivy SARIF report
    uses: ./.github/workflows/publish.yml
    with:
      release-tag: ""

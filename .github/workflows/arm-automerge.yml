name: arm-automerge

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  arm:
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enable automatic merging of the release ref
      pull-requests: write # arm auto-merge on the labelled release PR
    uses: rknightion/.github/.github/workflows/arm-automerge.yml@774210034cb603b840df2d136fd3e8fe33469d27 # v1.31.5

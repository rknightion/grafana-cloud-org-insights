name: arm-automerge

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  arm:
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enable automatic merging of the release ref
      pull-requests: write # arm auto-merge on the labelled release PR
    uses: rknightion/.github/.github/workflows/arm-automerge.yml@1ee56349bfcf2568e538479918b9bdd1b9196309 # v1.15.1

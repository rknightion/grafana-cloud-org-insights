name: arm-automerge

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  arm:
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enable automatic merging of the release ref
      pull-requests: write # arm auto-merge on the labelled release PR
    uses: rknightion/.github/.github/workflows/arm-automerge.yml@8d14adaa295c4a7670b1d4e744b070955b710598 # v1.24.0

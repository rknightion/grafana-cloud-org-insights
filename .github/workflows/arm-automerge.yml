name: arm-automerge

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  arm:
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enable automatic merging of the release ref
      pull-requests: write # arm auto-merge on the labelled release PR
    uses: rknightion/.github/.github/workflows/arm-automerge.yml@77faed457d4f87675fec4024e2cd526fe964d7c9 # v1.30.36

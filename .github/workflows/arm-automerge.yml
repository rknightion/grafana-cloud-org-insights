name: arm-automerge

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  arm:
    if: "github.event.label.name == 'release: ready'"
    permissions:
      contents: write      # enable automatic merging of the release ref
      pull-requests: write # arm auto-merge on the labelled release PR
    uses: rknightion/.github/.github/workflows/arm-automerge.yml@81fc55183265da0b21e92e690f70d679b20ed822 # v1.21.0

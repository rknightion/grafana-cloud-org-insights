name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The collector has no third-party imports: `emit/mimir.py` hand-rolls protobuf and snappy,
      # and the S3 and diff paths shell out to the AWS CLI. Pytest is CI tooling only; a product
      # dependency file appearing here means somebody added a dependency that the Fargate image
      # does not have.
      - name: Refuse a dependency file
        run: |
          for f in requirements.txt requirements-dev.txt pyproject.toml Pipfile poetry.lock; do
            if [ -e "$f" ]; then
              echo "::error::$f exists. This project ships a stdlib-only collector; the container image"
              echo "::error::installs nothing. Adding a dependency needs a Dockerfile change and a review."
              exit 1
            fi
          done
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Tests
        # Offline by construction - no AWS, no network, no credentials. If this needs either, the
        # fixture wiring has regressed and the suite has stopped being reproducible.
        run: python3 -m pytest -q

  identifiers:
    name: no leaked identifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        # This repo was forked from a live customer engagement. Four real leaks got through the first
        # manual sweep, three of them defaults that would have made a fresh deployment act on somebody
        # else's org: a hardcoded org id, a defaulted stack URL, a defaulted stack id, and a defaulted
        # folder uid. So the guard is mechanical rather than a review habit.
        #
        # Fixtures, generated views, and Backlog context are scanned too: a stale artifact can leak an
        # identifier as easily as code. The sensitive pattern set is a repository secret; committing
        # the list would disclose the exact customer context this gate exists to exclude.
        env:
          GCINSIGHT_CUSTOMER_IDENTIFIER_PATTERN: ${{ secrets.CUSTOMER_IDENTIFIER_PATTERN }}
        run: |
          bin/check-customer-identifiers --history
      - name: No em dashes in shipped text
        # House style is a spaced hyphen. Panel titles and descriptions are rendered to readers, and
        # the sweep is easier to keep than to redo. Backlog documents are operational records rather
        # than shipped product text; the canonical fan-out document is generated by agent-docs and
        # follows that source repository's style.
        run: |
          set -uo pipefail
          hits=$(grep -rIn $'\u2014' . \
                   --exclude-dir=.git \
                   --exclude-dir=backlog \
                   --exclude-dir=testdata \
                   --exclude-dir=__pycache__ \
                   --exclude-dir=.terraform || true)
          if [ -n "$hits" ]; then
            echo "::error::em dashes present, use a spaced hyphen:"
            echo "$hits"
            exit 1
          fi
          echo "clean"

  terraform:
    name: tofu validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
      - name: Validate the module
        # `-backend=false`: this is a reusable module with no provider block and no state.
        run: |
          cd terraform
          tofu init -backend=false
          tofu validate
      - name: Validate the standalone example
        run: |
          cd terraform/examples/standalone
          tofu init -backend=false
          tofu validate
      - name: Formatting
        run: tofu fmt -check -recursive terraform

  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    if: always()
    needs: [tests, identifiers, terraform]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"

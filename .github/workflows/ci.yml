name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs CI when the pull request body changes, so the acceptance evidence check reads
    # the new table. Every job runs on it: a job skipped by `if:` would report success to ci-success.
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      # The collector has no third-party imports: `emit/mimir.py` hand-rolls protobuf and snappy,
      # and the S3 and diff paths shell out to the AWS CLI. Pytest is CI tooling only; a product
      # dependency file appearing here means somebody added a dependency that the Fargate image
      # does not have.
      - name: Lint (refuse a dependency file)
        run: just lint
      - name: Install test runner
        run: just setup
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # Offline console contracts need real stdin and unwrapped JSON stdout.
          tofu_wrapper: false
      - name: Tests
        # Offline by construction - no AWS, no network, no credentials. If this needs either, the
        # fixture wiring has regressed and the suite has stopped being reproducible.
        run: just test

  identifiers:
    name: no leaked identifiers
    # The scan needs a repository secret, which a fork pull request never receives. It is skipped
    # there, and ci-success accepts that skip for a fork pull request only. A maintainer re-runs the
    # scan on a branch of this repository before merging a fork change.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Scan
        # This repo was forked from a live customer engagement. Four real leaks got through the first
        # manual sweep, three of them defaults that would have made a fresh deployment act on somebody
        # else's org: a hardcoded org id, a defaulted stack URL, a defaulted stack id, and a defaulted
        # folder uid. So the guard is mechanical rather than a review habit.
        #
        # Fixtures, generated views, and Backlog context are scanned too: a stale artifact can leak an
        # identifier as easily as code. The sensitive pattern set is a repository secret; committing
        # the list would disclose the exact customer context this gate exists to exclude.
        env:
          GCINSIGHT_CUSTOMER_IDENTIFIER_PATTERN: ${{ secrets.CUSTOMER_IDENTIFIER_PATTERN }}
        run: just check-identifiers
      - name: No em dashes in shipped text
        # House style is a spaced hyphen. Panel titles and descriptions are rendered to readers, and
        # the sweep is easier to keep than to redo. Backlog documents are operational records rather
        # than shipped product text; the canonical fan-out document is generated by agent-docs and
        # follows that source repository's style.
        run: just no-em-dashes

  terraform:
    name: tofu validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Validate and check formatting
        # `-backend=false`: this is a reusable module with no provider block and no state.
        run: just tf-validate

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    # The reusable fails on any event but pull_request; on a push to main this job is skipped.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request, so it runs on pull requests only.
  # Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  ci-success:
    name: ci-success
    runs-on: ubuntu-26.04
    if: always()
    needs: [tests, identifiers, terraform, ac-evidence, privacy-sweep, backlog-freeze]
    steps:
      - name: Require explicit success from every required job
        # Named results fail closed for skipped or absent leaves; filtering a
        # wildcard result list for failure/cancelled would accept those states.
        # Accepted skips: identifiers on a fork pull request (no secret), and ac-evidence,
        # privacy-sweep and backlog-freeze off a pull request (they run on pull requests only).
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          IDENTIFIERS_RESULT: ${{ needs.identifiers.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          AC_EVIDENCE_RESULT: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP_RESULT: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE_RESULT: ${{ needs.backlog-freeze.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          bad=0
          [[ "$TESTS_RESULT" == success && "$TERRAFORM_RESULT" == success ]] || bad=1
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            [[ "$IDENTIFIERS_RESULT" == success || "$IDENTIFIERS_RESULT" == skipped ]] || bad=1
          else
            [[ "$IDENTIFIERS_RESULT" == success ]] || bad=1
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$AC_EVIDENCE_RESULT" == success && "$PRIVACY_SWEEP_RESULT" == success && "$BACKLOG_FREEZE_RESULT" == success ]] || bad=1
          else
            [[ "$AC_EVIDENCE_RESULT" == success || "$AC_EVIDENCE_RESULT" == skipped ]] || bad=1
            [[ "$PRIVACY_SWEEP_RESULT" == success || "$PRIVACY_SWEEP_RESULT" == skipped ]] || bad=1
            [[ "$BACKLOG_FREEZE_RESULT" == success || "$BACKLOG_FREEZE_RESULT" == skipped ]] || bad=1
          fi
          if [[ "$bad" != 0 ]]; then
            echo "Required jobs must succeed: tests=${TESTS_RESULT}, identifiers=${IDENTIFIERS_RESULT}, terraform=${TERRAFORM_RESULT}, ac-evidence=${AC_EVIDENCE_RESULT}, privacy-sweep=${PRIVACY_SWEEP_RESULT}, backlog-freeze=${BACKLOG_FREEZE_RESULT} (event ${EVENT_NAME})"
            exit 1
          fi
          echo "ci-success - all required jobs explicitly succeeded or were skipped where allowed"

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@523c2251a1febb03bf6b6f5416ef1820136e8832 # v1.25.17
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

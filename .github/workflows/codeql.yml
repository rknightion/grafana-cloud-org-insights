name: CodeQL

on:
  # Keep the exact documentation list short so a truncated diff still includes a relevant path.
  push:
    branches: [main]
    paths-ignore: [AGENTS.md, CONTRIBUTING.md, LOOP.md, README.md, docs/architecture.md]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@a338a012f940c9f9c2bb4d116082d48fe8b35c8d # v1.33.0
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@5d0de41efd56d620e1e9e7e45a844cdb4828b120 # v1.25.12
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

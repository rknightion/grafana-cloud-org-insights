name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@81fc55183265da0b21e92e690f70d679b20ed822 # v1.21.0
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@d5995d27ca2ffc697f06e312c69541b149ab2fd7 # v1.25.27
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

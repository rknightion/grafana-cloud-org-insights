name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 3 * * 6"

permissions: {}

jobs:
  codeql:
    permissions:
      security-events: write # upload CodeQL results
      packages: read         # resolve private action packages if required
      actions: read          # inspect workflow metadata
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@ff43f62eaec9f41d49b9a208d86b2eb932c97056 # v1.18.1
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

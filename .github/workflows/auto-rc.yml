name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run still queued behind it - 20.6
# runner-hours of pure polling fleet-wide, and 5 of 17 in-flight jobs at one
# sample. workflow_run fires only once CI has a verdict.
#
# `workflows:` matches the workflow's `name:` field, NOT its filename. If that
# name changes this silently stops firing and RCs stop being cut, with no error.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-rc
  cancel-in-progress: false

jobs:
  rc:
    # workflow_run fires for FAILED and cancelled runs too, so the conclusion
    # check is what actually gates the RC on green CI.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write     # create the RC tag and GitHub prerelease
      pull-requests: read # find the open release PR
      checks: read        # wait for ci-success on this commit
    uses: rknightion/.github/.github/workflows/auto-rc.yml@97f4a7ad0cd1ddd83562a30b9061ef8295242405 # v1.14.0
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on - it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/grafana-cloud-org-insights

  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write        # attach SBOMs to the prerelease
      packages: write        # push the RC image to GHCR
      id-token: write        # obtain keyless signing credentials
      attestations: write    # publish build provenance
      security-events: write # upload the Trivy SARIF report
    uses: ./.github/workflows/publish.yml
    with:
      release-tag: ${{ needs.rc.outputs.tag }}

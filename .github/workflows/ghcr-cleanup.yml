name: ghcr-cleanup

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete expired GHCR package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@1a8cf1f4970b9ffd51e395f7075dcc0174a09777 # v1.25.7
    with:
      packages: "grafana-cloud-org-insights"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

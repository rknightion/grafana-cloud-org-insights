name: ghcr-cleanup

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete expired GHCR package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@5d0de41efd56d620e1e9e7e45a844cdb4828b120 # v1.25.12
    with:
      packages: "grafana-cloud-org-insights"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

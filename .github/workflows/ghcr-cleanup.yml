name: ghcr-cleanup

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete expired GHCR package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@42113a21e3ab32288c0931d8682ebbd80ff30c37 # v1.25.13
    with:
      packages: "grafana-cloud-org-insights"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

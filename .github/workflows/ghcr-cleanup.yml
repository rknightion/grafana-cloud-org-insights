name: ghcr-cleanup

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete expired GHCR package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@8c1e89103d1a86179c2e94356b85bedd7c543a42 # v1.9.3
    with:
      packages: "grafana-cloud-org-insights"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

name: ghcr-cleanup

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete expired GHCR package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@99a633c653561f10ef871cac2f3b2e3aad13bb5f # v1.10.1
    with:
      packages: "grafana-cloud-org-insights"
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
